                    <br><br>幼なじみのふたりは、冒険家チャールズ・マンツに憧れて、南米の“パラダイスの滝”に行こうと約束していた。
                    <br><br>ある日、カールじいさんは、約束を果たそうと、住み慣れた家に無数の風船を結びつけ、滝を目指して大空へ！
                    <br><br>偶然空飛ぶ家に乗り合わせた少年ラッセル、南米で出会う不思議な犬ダグと共に、冒険の旅が始まる。
